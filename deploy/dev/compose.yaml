# Gatepost edge, dev server (B3b). Host ports avoid the v1-era edge
# containers that hold 80/443/8080/8443/8444/8084 on this box (progress.md):
# 8081 -> HTTP, 8445 -> HTTPS. Test URLs therefore use those ports.
name: gatepost-edge-dev

services:
  edge:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.edge
    image: gatepost-edge:dev
    restart: unless-stopped
    healthcheck:
      # The admin API answering is the edge's liveness (caddy's own process
      # health): the bootstrap config and every generated config listen on
      # 2019. Any answer = healthy; the poller's depends_on gates on this.
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:2019/config"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8445:443"
    volumes:
      - ./Caddyfile.bootstrap:/etc/caddy/Caddyfile:ro
      - caddy_config:/config  # Caddy's own persisted state
    # BOTH networks: the default (pinned 172.28.0.0/24) carries the
    # published ports, and `origin` hosts the item-7 test origin. The
    # origin network squats 192.88.99.0/24 — the deprecated 6to4 relay
    # anycast range (RFC 3068, returned to IANA by RFC 7526): public to
    # the API's SSRF rules (outside domains.forbidV4Nets, so a customer
    # origin may point at it) while its traffic never leaves the host.
    # Edge -> origin-test is same-bridge L2: it never traverses FORWARD,
    # so DOCKER-USER/the egress firewall is not even consulted (and the
    # range is public, so the firewall would pass it anyway).
    networks: [default, origin]
    # Container stdout/stderr logs: capped rotation (item 6). The edge's
    # structured ACCESS logs go to files on caddy_data (the poller's
    # GP_EDGE_ACCESS_LOG, wrapped by caddy's own roll settings); this caps
    # only the docker json-file stream every container still produces.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Edge poller (B3b item 3). Off by default — `docker compose --profile
  # poller up -d` starts it. It SHARES the edge container's network
  # namespace, so its loopback admin call (GP_EDGE_ADMIN_ADDR, default
  # 127.0.0.1:2019) reaches the edge's admin API and nothing new is
  # published. (No extra_hosts here: a custom host-to-IP mapping conflicts
  # with network_mode service:edge — and the old host.docker.internal
  # default resolved to 172.17.0.1 anyway, the same host address the egress
  # allowlist pins.) Needs two files in deploy/dev/secrets/ (untracked,
  # never committed): `token` (a node token minted by the API) and
  # `snapshot_key` (the API's GP_SNAPSHOT_KEY).
  poller:
    profiles: [poller]
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.poller
    image: gatepost-poller:dev
    restart: unless-stopped
    depends_on:
      edge:
        condition: service_healthy
        # docker kill on the edge leaves this container in the dead network
        # namespace; compose restarts it whenever the edge is restarted or
        # recreated (the daemon-level kill case is the poller's own
        # AdminGrace exit + restart policy).
        restart: true
    network_mode: "service:edge"
    healthcheck:
      # The ask listener answering /health means this process is alive AND
      # its loopback still works — the check dies with a killed edge
      # container exactly like the poller itself does.
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8099/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      GP_EDGE_API_BASE: ${GP_EDGE_API_BASE:-http://172.17.0.1:8080}
      GP_EDGE_TOKEN_FILE: /run/secrets/token
      GP_SNAPSHOT_KEY_FILE: /run/secrets/snapshot_key
      GP_EDGE_STATE_DIR: /state
      GP_EDGE_ADMIN_ADDR: 127.0.0.1:2019
      GP_EDGE_HTTP_ADDR: ":80"
      GP_EDGE_HTTPS_ADDR: ":443"
      GP_EDGE_ASK_ADDR: 127.0.0.1:8099
      # Issuer for on-demand certs: staging (default) | internal | production
      # (explicit opt-in only; refused with GP_EDGE_ALLOW_LOOPBACK).
      GP_EDGE_ISSUER: ${GP_EDGE_ISSUER:-staging}
      # Structured access logs (item 6): the poller names this path in every
      # generated caddy config; caddy's file writer on the edge volume
      # (caddy_data) creates the dir and rolls at 10MB x5. Empty = logging off.
      GP_EDGE_ACCESS_LOG: /data/logs/access.json
      # B3c item 1: Coraza edge WAF, detection-only for every served host.
      # CRS rules log+audit (never block). Edge ships coraza-caddy v2.6.2 with
      # the x/wafredactor custom audit formatter (blanks [data]/[uri] values at
      # format time). Audit: redacted Part A+H+Z only (no body/cookies/headers/query).
      GP_EDGE_WAF_MODE: ${GP_EDGE_WAF_MODE:-detection}
      GP_EDGE_WAF_AUDIT_LOG: ${GP_EDGE_WAF_AUDIT_LOG:-/data/logs/waf_audit.log}
      GP_EDGE_WAF_BODY_LIMIT_MB: ${GP_EDGE_WAF_BODY_LIMIT_MB:-10}
      GP_EDGE_WAF_PARANOIA: ${GP_EDGE_WAF_PARANOIA:-1}
    volumes:
      - ${GP_EDGE_SECRETS_DIR:-./secrets}:/run/secrets:ro
      - poller_state:/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Realistic test origin (item 7). Static IP so the API's origin records
  # stay literal and deterministic across recreations.
  origin-test:
    build:
      context: .
      dockerfile: Dockerfile.origin-test
    image: gatepost-origin-test:dev
    restart: unless-stopped
    networks:
      origin:
        ipv4_address: 192.88.99.10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  poller_state:

# The edge network's subnet and bridge name are PINNED so the egress firewall
# (scripts/edge-egress.sh) can match them by address across reboots and
# network recreations; a pool-assigned subnet would drift and leave stale
# rules. 172.28.0.0/24 avoids docker0 (172.17/16) and the EC2 VPC (172.31/16).
networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: br-gpedge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  # The item-7 origin network: 192.88.99.0/24 is outside forbidV4Nets (see
  # the edge service comment for why this range), pinned name + subnet for
  # the same reasons as the default network.
  origin:
    driver_opts:
      com.docker.network.bridge.name: br-gporigin
    ipam:
      config:
        - subnet: 192.88.99.0/24
          gateway: 192.88.99.1
